{"name": "Extract site zip", "on": {"push": {"paths": ["*.zip"]}, "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"extract": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"name": "Extract and commit", "run": "set -e\nunzip -o -q star-marwen-jerbi.zip -d /tmp/site\ncp -r /tmp/site/star-marwen-jerbi/. .\ngit rm -q --cached star-marwen-jerbi.zip\nrm -f star-marwen-jerbi.zip\npython3 - <<'PY'\nimport pathlib\nurl = \"https://star-marwen-jerbi.rayantriki.com\"\nfor f in [\"index.html\", \"sitemap.xml\", \"robots.txt\"]:\n    p = pathlib.Path(f); p.write_text(p.read_text(encoding=\"utf-8\").replace(\"https://www.example.com\", url), encoding=\"utf-8\")\np = pathlib.Path(\"mentions-legales.html\")\nt = p.read_text(encoding=\"utf-8\")\nold = \"<span class=\\\"todo\\\">À compléter : nom, adresse et contact de l'hébergeur du site.</span>\"\nnew = \"OVH SAS – 2 rue Kellermann, 59100 Roubaix, France – <a href=\\\"https://www.ovhcloud.com\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">www.ovhcloud.com</a>\"\np.write_text(t.replace(old, new), encoding=\"utf-8\")\nPY\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add -A\ngit commit -m \"Extract site from zip and set production URL\"\ngit push"}]}}}
